# The capstone borrows :core from the sibling student build, so every path here reaches across.
kotlin.jvmToolchain=21

# ── runAgent, for the step where an agent implements your specification ──────────────────────────
implCoreSrc=../spec-test-driven/core/src/main/kotlin
implPackage=org/jetbrains/kotlin/course/duck/shop/pricing
# No test catalog is injected into what the agent writes: the tests that judge it are the ones YOU wrote.
implTests=
# No differential probe either. The franchise one names the open questions in its own comments — which
# is the whole exercise — so it stays in spec-test-driven-grading/ and you compare two runs by hand.
implProbe=
implSurface=surface.md
promptDir=../spec-test-driven/tools

# Pricing is settled and OUT OF SCOPE here: if an agent writes its own priceFor anyway, the harness
# strips it so its calls resolve to the settled one. This changes behaviour and is opt-in for that reason.
#
# The FILE, not its directory. Pointing at inherited/src/main/kotlin also caught BestOffer.kt, so
# `bestOffer` counted as already-written and was stripped — the one function surface.md asks for.
implExisting=inherited/src/main/kotlin/org/jetbrains/kotlin/course/duck/shop/pricing/Pricing.kt
