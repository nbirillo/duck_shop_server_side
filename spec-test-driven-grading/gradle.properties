kotlin.code.style=official

# Mutation testing (duck-shop.mutants): this build holds the GRADED mutant set, and reads the
# algebra and the suites from the sibling student build. Kept outside spec-test-driven/ so a
# learner's agent cannot read the catalog and learn exactly which cases to test.
mutantsCatalog=mutants/catalog.json
mutantsCoreSrc=../spec-test-driven/core/src/main/kotlin
mutantsLearnerTests=../spec-test-driven/exercises/write-tests/src/test/kotlin
mutantsAuthoredTests=../spec-test-driven/tests/kotlin
mutantsOut=mutants

# The mutant modules are independent, so compile them in parallel.
org.gradle.parallel=true
