kotlin.code.style=official

# Mutation testing (duck-shop.mutants): this build holds the GRADED mutant set, and reads the
# algebra and the suites from the sibling student build. Kept outside spec-test-driven/ so a
# learner's agent cannot read the catalog and learn exactly which cases to test.
mutantsCatalog=mutants/catalog.json
mutantsCoreSrc=../spec-test-driven/core/src/main/kotlin
mutantsLearnerTests=../spec-test-driven/exercises/write-tests/src/test/kotlin
mutantsOut=mutants

# The mutant modules are independent, so compile them in parallel.
org.gradle.parallel=true

# 11.4 implement-from-spec (duck-shop.spec). The student build's defaults are relative to itself, so
# this build restates every path — and unlike the student build it DOES run the property catalog.
implCoreSrc=../spec-test-driven/core/src/main/kotlin
implTests=pricing-properties/kotlin
implProbe=../spec-test-driven/tools/pricing-probe/kotlin
implSurface=../spec-test-driven/exercises/write-spec/README.md
referenceRecording=reference-probe/recording.txt

